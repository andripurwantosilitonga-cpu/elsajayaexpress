<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking - Elsa Jaya Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #003366;
            --accent: #ff8c00;
            --light-bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light-bg); }
        
        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,51,102,0.8), rgba(0,51,102,0.8)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 0;
            text-align: center;
        }

        /* Search Box */
        .search-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: -50px;
            border: none;
        }
        .btn-track {
            background-color: var(--accent);
            color: white;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-track:hover { background-color: #e67e00; color: white; transform: translateY(-2px); }

        /* Timeline Tracker */
        .tracking-timeline {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #fff;
            display: none; /* Sembunyikan sebelum dicari */
        }
        .status-badge {
            font-size: 0.9rem;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* Floating WA */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 1000;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">ELSA JAYA EXPRESS</a>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1 class="display-5 fw-bold">Lacak Pengiriman Anda</h1>
            <p class="lead">Cepat, Aman, dan Terpercaya Sampai Tujuan</p>
        </div>
    </section>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card search-card">
                    <div class="input-group mb-3">
                        <input type="text" id="resiInput" class="form-control form-control-lg" placeholder="Masukkan Nomor Resi (Contoh: EJE-001)">
                        <button class="btn btn-track btn-lg px-4" type="button" onclick="lacakPaket()">LACAK</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="resultArea" class="row justify-content-center mt-4 mb-5">
            </div>
    </div>

    <a href="https://wa.me/628123456789" class="whatsapp-btn" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        function lacakPaket() {
            const resi = document.getElementById('resiInput').value;
            const resultArea = document.getElementById('resultArea');

            if (resi === "") {
                alert("Silakan masukkan nomor resi!");
                return;
            }

            // Tampilkan Loading
            resultArea.innerHTML = '<div class="text-center"><div class="spinner-border text-primary"></div><p>Mencari data...</p></div>';

            // GANTI LINK BERIKUT DENGAN LINK WEB APP SCRIPT ANDA
            const webAppUrl = "URL_WEB_APP_SCRIPT_ANDA";

            fetch(`${webAppUrl}?resi=${resi}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "error") {
                        resultArea.innerHTML = `<div class="alert alert-danger">Nomor Resi ${resi} tidak ditemukan!</div>`;
                    } else {
                        // Tentukan warna badge berdasarkan status
                        let badgeColor = "bg-primary";
                        if (data.status_pengiriman === "Barang Telah Sampai") badgeColor = "bg-success";
                        if (data.status_pengiriman === "Dalam Perjalanan") badgeColor = "bg-warning text-dark";

                        resultArea.innerHTML = `
                            <div class="col-md-8">
                                <div class="card shadow-sm border-0 p-4">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h5 class="fw-bold mb-0">${data.no_resi}</h5>
                                        <span class="badge ${badgeColor} status-badge">${data.status_pengiriman}</span>
                                    </div>
                                    <hr>
                                    <div class="row">
                                        <div class="col-6">
                                            <p class="text-muted mb-1">Tujuan</p>
                                            <p class="fw-bold">${data.tujuan}</p>
                                        </div>
                                        <div class="col-6 text-end">
                                            <p class="text-muted mb-1">Update Terakhir</p>
                                            <p class="fw-bold">${data.tanggal_update}</p>
                                        </div>
                                    </div>
                                    <div class="mt-3 p-3 bg-light rounded">
                                        <i class="fas fa-info-circle me-2 text-primary"></i>
                                        <strong>Keterangan:</strong> ${data.keterangan || "Tidak ada detail tambahan"}
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    resultArea.innerHTML = `<div class="alert alert-danger">Gagal menghubungi server. Pastikan Web App Script sudah dipublikasikan.</div>`;
                });
        }
    </script>
</body>
</html>
